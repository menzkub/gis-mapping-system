name: Build & update version.json

on:
  push:
    branches: [main]
    paths-ignore:
      - 'version.json'

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # คอมไพล์ JSX → dist/*.js ล่วงหน้า (เบราว์เซอร์ไม่ต้องรัน Babel standalone อีกต่อไป)
      # ปักเวอร์ชัน esbuild ให้ผลลัพธ์ deterministic — output เหมือนเดิม = ไม่เกิด commit ซ้ำซ้อน
      - name: Build dist/ (esbuild)
        run: |
          mkdir -p dist
          for f in lang components MapView AuthScreen SearchView AdminPanel PaymentView app; do
            npx -y esbuild@0.25.5 "$f.jsx" --loader:.jsx=jsx --target=es2020 \
              --minify-whitespace --minify-syntax --charset=utf8 --outfile="dist/$f.js"
          done

      - name: Write version.json
        run: |
          cat > version.json << EOF
          {
            "commit": "$(git rev-parse HEAD)",
            "shortCommit": "$(git rev-parse --short HEAD)",
            "message": $(git log -1 --pretty=%s | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))"),
            "date": "$(git log -1 --pretty=%cI)",
            "branch": "main"
          }
          EOF

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json dist
          git diff --cached --quiet || git commit -m "chore: build dist + version.json [skip ci]"
          git push
