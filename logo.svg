<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b4dca"/>
      <stop offset="100%" stop-color="#1b0926"/>
    </linearGradient>
    <linearGradient id="boltG" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffcf8a"/>
      <stop offset="100%" stop-color="#f47b20"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="15" fill="url(#bgG)"/>

  <!-- Subtle inner highlight -->
  <rect width="64" height="32" rx="15" fill="rgba(255,255,255,0.05)"/>

  <!-- Lightning bolt -->
  <path d="M 36 7 L 16 36 H 28 L 20 57 L 48 28 H 36 L 44 7 Z"
        fill="url(#boltG)" filter="url(#glow)"/>
</svg>
