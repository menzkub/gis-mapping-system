<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e0a36"/>
      <stop offset="100%" stop-color="#080310"/>
    </linearGradient>

    <!-- Radial spotlight from center-top -->
    <radialGradient id="spot" cx="48%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(155,77,202,0.28)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- Lightning bolt — white tip to warm orange -->
    <linearGradient id="bolt" x1="0.35" y1="0" x2="0.65" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="28%"  stop-color="#ffe8a0"/>
      <stop offset="100%" stop-color="#f47b20"/>
    </linearGradient>

    <!-- Ring arc gradient -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#9b4dca"/>
      <stop offset="50%"  stop-color="#f47b20"/>
      <stop offset="100%" stop-color="#9b4dca"/>
    </linearGradient>

    <!-- Glow for bolt (soft halo) -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Outer ambient glow (orange) -->
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/></feMerge>
    </filter>

    <!-- Inner glass highlight -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Base rounded rect -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Spotlight layer -->
  <rect width="64" height="64" rx="16" fill="url(#spot)"/>

  <!-- Glass sheen (top half highlight) -->
  <rect width="64" height="32" rx="16" fill="url(#glass)"/>

  <!-- Outer ring (360° subtle) -->
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#ring)" stroke-width="1" opacity="0.35"/>

  <!-- Inner dashed ring (tick marks at 12/3/6/9) -->
  <circle cx="32" cy="32" r="21"   fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.6"/>

  <!-- Tick marks at 4 cardinal positions -->
  <line x1="32" y1="6.5"  x2="32" y2="11"  stroke="#9b4dca" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <line x1="57.5" y1="32" x2="53" y2="32"  stroke="#f47b20" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <line x1="32" y1="57.5" x2="32" y2="53"  stroke="#9b4dca" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <line x1="6.5" y1="32"  x2="11" y2="32"  stroke="#f47b20" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>

  <!-- Dot nodes at ticks -->
  <circle cx="32"   cy="6.5"  r="1.6" fill="#9b4dca" opacity="0.75"/>
  <circle cx="57.5" cy="32"   r="1.6" fill="#f47b20" opacity="0.75"/>
  <circle cx="32"   cy="57.5" r="1.6" fill="#9b4dca" opacity="0.75"/>
  <circle cx="6.5"  cy="32"   r="1.6" fill="#f47b20" opacity="0.75"/>

  <!-- Ambient orange halo behind bolt -->
  <path d="M 36.5 13 L 22 34.5 H 30.5 L 24 52 L 44.5 31 H 35.5 L 42.5 13 Z"
        fill="#f47b20" filter="url(#halo)" opacity="0.45"/>

  <!-- Main lightning bolt -->
  <path d="M 36.5 13 L 22 34.5 H 30.5 L 24 52 L 44.5 31 H 35.5 L 42.5 13 Z"
        fill="url(#bolt)" filter="url(#glow)"/>

  <!-- Specular tip highlight -->
  <path d="M 36.5 13 L 31.5 23.5 H 37 L 40.5 13 Z"
        fill="rgba(255,255,255,0.6)"/>
</svg>
