<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{margin:0;padding:0;background:#1b0926;}
    #splash{
      position:fixed;inset:0;z-index:99999;
      background:radial-gradient(130% 110% at 10% 0%,#8b3fc4 0%,#321148 55%,#1b0926 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
      transition:opacity .45s cubic-bezier(.4,0,.2,1);
    }
    #splash.out{opacity:0;pointer-events:none;}
    #splash-logo{
      width:88px;height:88px;border-radius:26px;
      box-shadow:0 0 0 1px rgba(139,63,196,.35),0 24px 64px rgba(139,63,196,.55);
      animation:sp-float 2.4s ease-in-out infinite;
    }
    #splash-title{
      margin-top:22px;font-size:18px;font-weight:800;color:#fff;letter-spacing:-.01em;
      font-family:'IBM Plex Sans Thai',system-ui,sans-serif;
      animation:sp-in .55s .1s both;
    }
    #splash-sub{
      margin-top:5px;font-size:12px;color:rgba(255,255,255,.45);font-weight:500;
      font-family:'IBM Plex Sans Thai',system-ui,sans-serif;letter-spacing:.04em;
      animation:sp-in .55s .22s both;
    }
    #splash-ring{
      margin-top:36px;width:38px;height:38px;
      border:2.5px solid rgba(139,63,196,.22);
      border-top-color:#a855f7;border-radius:50%;
      animation:sp-spin .75s linear infinite,sp-in .4s .35s both;
    }
    @keyframes sp-float{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-9px) scale(1.04);}}
    @keyframes sp-spin{to{transform:rotate(360deg);}}
    @keyframes sp-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  </style>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <title>ระบบสารสนเทศภูมิศาสตร์</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6b2c91" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GIS Meter" />

  <!-- DNS prefetch + preconnect สำหรับทุก CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous"/>

  <!-- App CSS -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

  <!-- React 18 Production builds (เร็วกว่า development ~10x) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <!-- Babel Standalone (compile JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js" crossorigin="anonymous"></script>

  <!-- html2canvas standalone (exposes window.html2canvas for PNG export) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>

  <!-- html2pdf — client-side HTML → PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>

  <!-- qrcode-generator — lightweight QR code for infographic cards -->

</head>
<body>
  <div id="splash" aria-hidden="true">
    <img id="splash-logo" src="logo.svg" alt="" />
    <div id="splash-title">PEA Meter &amp; TR</div>
    <div id="splash-sub">ระบบสารสนเทศภูมิศาสตร์</div>
    <div id="splash-ring"></div>
  </div>
  <div id="root"></div>

  <!-- Supabase client + mappers (must load before JSX files) -->
  <script src="config.js"></script>

  <!-- App components -->
  <script type="text/babel" src="lang.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="MapView.jsx"></script>
  <script type="text/babel" src="AuthScreen.jsx"></script>
  <script type="text/babel" src="SearchView.jsx"></script>
  <script type="text/babel" src="AdminPanel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/gis-mapping-system/service-worker.js")
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
